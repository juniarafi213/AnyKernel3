name: Build Kernel (AnyKernel3 CI)

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: 'Kernel Source Repository'
        required: true
        default: 'juniarafi213/xiaomi_sm8150_kernel_e404'
      kernel_branch:
        description: 'Kernel Branch to Build'
        required: true
        default: 'staging'
      defconfig:
        description: 'Kernel Defconfig'
        required: true
        default: 'vayu-bpf_defconfig'
      build_type:
        description: 'Clang Toolchain'
        required: true
        default: 'aosp-clang'
        type: choice
        options:
          - 'aosp-clang'
          - 'neutron-clang'

jobs:
  build:
    name: Compile Kernel & Package Zip
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout AnyKernel3
        uses: actions/checkout@v4
        with:
          ref: vayu
          path: AnyKernel3

      - name: Setup Linux Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git gnupg gperf libxml2 libxml2-utils lzop pngcrush rsync \
            schedtool squashfs-tools xsltproc zip zlib1g-dev libssl-dev libelf-dev \
            libtinfo5 libncurses5 python3 python-is-python3 binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

      - name: Download Clang Toolchain
        run: |
          mkdir -p toolchain
          if [ "${{ github.event.inputs.build_type }}" = "neutron-clang" ]; then
            echo "--- Downloading Neutron Clang ---"
            cd toolchain
            curl -sLO https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman
            bash antman -S
            bash antman --patch=glibc
            cd ..
          else
            echo "--- Downloading AOSP Clang ---"
            git clone --depth=1 https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r547379.git -b 15.0 toolchain/clang
          fi

      - name: Clone Kernel Source
        run: |
          echo "Cloning https://github.com/${{ github.event.inputs.kernel_repo }}.git (branch: ${{ github.event.inputs.kernel_branch }})"
          git clone --depth=1 -b ${{ github.event.inputs.kernel_branch }} https://github.com/${{ github.event.inputs.kernel_repo }}.git kernel
          cd kernel
          echo "--- Syncing Git Submodules (KernelSU, etc.) ---"
          git submodule update --init --recursive --depth=1 || git submodule update --init --recursive
          cd ..

      - name: Compile Kernel
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "neutron-clang" ]; then
            export PATH="${{ github.workspace }}/toolchain/bin:$PATH"
          else
            export PATH="${{ github.workspace }}/toolchain/clang/bin:$PATH"
          fi

          clang --version | head -n 1

          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER="Project113"
          export KBUILD_BUILD_HOST="Workstation"

          echo "--- Generating defconfig: ${{ github.event.inputs.defconfig }} ---"
          make O=out ARCH=arm64 ${{ github.event.inputs.defconfig }}

          echo "--- Starting Kernel Compilation ---"
          make -j$(nproc --all) O=out ARCH=arm64 \
            CC="clang" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            LLVM=1 LLVM_IAS=1 LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip

      - name: Package with AnyKernel3
        run: |
          K_IMG="kernel/out/arch/arm64/boot/Image"
          K_DTBO="kernel/out/arch/arm64/boot/dtbo.img"
          K_DTB="kernel/out/arch/arm64/boot/dtb.img"

          if [ ! -f "$K_IMG" ]; then
            echo "Error: Kernel Image was not generated!"
            exit 1
          fi

          echo "--- Copying artifacts to AnyKernel3 ---"
          TARGET="VAYU"
          DEVICE="vayu"
          if [[ "${{ github.event.inputs.defconfig }}" == *"bpf"* ]]; then
            TARGET="VAYBPF"
            DEVICE="vaybpf"
          fi

          sed -i "/devicename=/c\devicename=${DEVICE}" AnyKernel3/anykernel.sh

          cp "$K_IMG" AnyKernel3/${TARGET}-Image
          [ -f "$K_DTBO" ] && cp "$K_DTBO" AnyKernel3/${TARGET}-dtbo.img
          if [ -f "$K_DTB" ]; then
            cp "$K_DTB" AnyKernel3/${TARGET}-dtb
          elif [ -f "kernel/out/arch/arm64/boot/dtb" ]; then
            cp "kernel/out/arch/arm64/boot/dtb" AnyKernel3/${TARGET}-dtb
          fi

          cd AnyKernel3
          ZIP_NAME="RE404-${TARGET}-${{ github.event.inputs.kernel_branch }}-$(date +%Y%m%d-%H%M).zip"
          zip -r9 "../$ZIP_NAME" * -x .git* README* *.zip
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          echo "Package created: $ZIP_NAME"

      - name: Upload Flashable Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: "${{ env.ZIP_NAME }}"
          retention-days: 14
